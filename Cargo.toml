[workspace]
members = [
    "crates/dora-lite-core",
    "crates/dora-lite-shm",
    "crates/dora-lite-node-api",
    "crates/dora-lite-runtime",
    "examples/waymo-sim"
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Julian Zheng <julian@gatech.edu>"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
memmap2 = "0.9"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.10", features = ["v4"] }
bytes = "1.7"
rand = "0.8"
serde_json = "1.0"
crossbeam-channel = "0.5"
anyhow = "1.0"

# Internal workspace crates
dora-lite-core = { path = "crates/dora-lite-core" }
dora-lite-shm = { path = "crates/dora-lite-shm" }
dora-lite-node-api = { path = "crates/dora-lite-node-api" }
dora-lite-runtime = { path = "crates/dora-lite-runtime" }
